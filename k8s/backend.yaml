apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deploy
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: shyunnnn/find-me-backend:52-dev
        ports:
        - containerPort: 8080
        - containerPort: 18081
        envFrom:
        - secretRef:
            name: backend-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: backend-svc
spec:
  selector:
    app: backend
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
    - name: monitoring
      protocol: TCP
      port: 18081       # 외부에서 접속할 포트
      targetPort: 18081 # 컨테이너 내부로 전달할 포트
  type: ClusterIP