apiVersion: v1
kind: ConfigMap
metadata:
  name: filebeat-config
  namespace: lucas-elk
  labels:
    app: filebeat
data:
  filebeat.yml: |-
    filebeat.inputs:
      - type: filestream
        id: container-logs
        prospector.scanner.symlinks: true
        parsers:
          - container: ~
        paths:
          - /var/log/containers/*.log
        processors:
          - add_kubernetes_metadata:
              host: ${NODE_NAME}
              matchers:
                - logs_path:
                    logs_path: /var/log/containers/
          - drop_event:
              when:
                not:
                  and:
                    - equals:
                        kubernetes.namespace: "prod"
                    - equals:
                        kubernetes.labels.app: "backend"
          - decode_json_fields:
              fields: ["message"]
              target: ""
              overwrite_keys: true
              add_error_key: true

    output.logstash:
      hosts: ["logstash.lucas-elk.svc.cluster.local:5044"]

    setup.template.enabled: false
    logging.metrics.enabled: false
