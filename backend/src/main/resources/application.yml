spring:
    application:
        name: lucas

    datasource:
        url: ${SPRING_DATASOURCE_URL}
        username: ${SPRING_DATASOURCE_USERNAME}
        password: ${SPRING_DATASOURCE_PASSWORD}
        driver-class-name: org.postgresql.Driver

    data:
        redis:
            host: ${REDIS_HOST}
            port: ${REDIS_PORT}
            password: ${REDIS_PASSWORD:}

    jpa:
        hibernate:
            ddl-auto: update
        open-in-view: false
        properties:
            hibernate:
                format_sql: true
        show-sql: true

    security:
        oauth2:
            client:
                registration:
                    google:
                      client-id: ${GOOGLE_CLIENT_ID}
                      client-secret: ${GOOGLE_CLIENT_SECRET}
                      scope:
                        - profile
                        - email

                    ssafy:
                      client-id: ${SSAFY_CLIENT_ID}
                      client-secret: ${SSAFY_CLIENT_SECRET}
                      provider: ssafy
                      authorization-grant-type: authorization_code
                      redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

                provider:
                    ssafy:
                        authorization-uri: https://project.ssafy.com/oauth/sso-check
                        token-uri: https://project.ssafy.com/ssafy/oauth2/token
                        user-info-uri: https://project.ssafy.com/ssafy/resources/userInfo
                        user-name-attribute: userId


    jwt:
        secret: ${JWT_SECRET}
        access-token-expiration: 1800000      # 30분 (ms)
        refresh-token-expiration: 1209600000  # 14일 (ms)

cloud:
  aws:
    s3:
      bucket: ${AWS_S3_BUCKET}
    region:
      static: ${AWS_REGION}
    credentials:
      access-key: ${AWS_ACCESS_KEY}
      secret-key: ${AWS_SECRET_KEY}
    cdn:
      url: ${AWS_CDN_URL:}

server:
  port: ${SERVER_PORT:8080}

app:
    cors:
        allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
    frontend:
        url: ${FRONTEND_URL:http://localhost:5173}
