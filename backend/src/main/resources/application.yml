spring:
    application:
        name: lucas

    datasource:
        url: ${SPRING_DATASOURCE_URL}
        username: ${SPRING_DATASOURCE_USERNAME}
        password: ${SPRING_DATASOURCE_PASSWORD}
        driver-class-name: org.postgresql.Driver

    data:
        redis:
            host: ${REDIS_HOST}
            port: ${REDIS_PORT}
            password: ${REDIS_PASSWORD:}

    jpa:
        hibernate:
            ddl-auto: validate
        open-in-view: false
        properties:
            hibernate:
                format_sql: true
        show-sql: true

    security:
        oauth2:
            client:
                registration:
                    google:
                      client-id: ${GOOGLE_CLIENT_ID}
                      client-secret: ${GOOGLE_CLIENT_SECRET}
                      scope:
                        - profile
                        - email

                    ssafy:
                      client-id: ${SSAFY_CLIENT_ID}
                      client-secret: ${SSAFY_CLIENT_SECRET}
                      provider: ssafy
                      authorization-grant-type: authorization_code
                      redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

                provider:
                    ssafy:
                        authorization-uri: https://project.ssafy.com/oauth/sso-check
                        token-uri: https://project.ssafy.com/ssafy/oauth2/token
                        user-info-uri: https://project.ssafy.com/ssafy/resources/userInfo
                        user-name-attribute: userId

    mail:
      host: smtp.zoho.com
      port: 587
      username: ${MAIL_USERNAME}
      password: ${MAIL_PASSWORD}
      properties:
        mail:
          smtp:
            auth: true
            starttls:
              enable: true
              required: true
            connectiontimeout: 5000
            timeout: 5000
            writetimeout: 5000

    servlet:
      multipart:
        max-file-size: 10MB
        max-request-size: 10MB

    jwt:
        secret: ${JWT_SECRET}
        access-token-expiration: 28800000      # 30분 (ms)
        refresh-token-expiration: 3600000     # 1시간 (ms)

cloud:
  aws:
    s3:
      bucket: ${AWS_S3_BUCKET}
    region:
      static: ${AWS_REGION}
    credentials:
      access-key: ${AWS_ACCESS_KEY}
      secret-key: ${AWS_SECRET_KEY}
    cdn:
      url: ${AWS_CDN_URL:}

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

management:
  server:
    port: 18081 # 애플리케이션의 8080과 충돌 및 외부 노출을 막기 위해 분리
  endpoints:
    web:
      exposure:
        include: prometheus, health, info
  metrics:
    tags:
      application: lucas-backend # 식별용 태그

app:
    cors:
        allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
    frontend:
        url: ${FRONTEND_URL:http://localhost:5173}
    hint:
        orchestrator-service-url: ${HINT_ORCHESTRATOR_SERVICE_URL}
        orchestrator-timeout-ms: ${HINT_ORCHESTRATOR_TIMEOUT_MS}
        search-top-k: ${HINT_SEARCH_TOP_K}
        evidence-limit: ${HINT_EVIDENCE_LIMIT}
        min-similarity: ${HINT_MIN_SIMILARITY}
        recent-action-limit: ${HINT_RECENT_ACTION_LIMIT}
        es-enabled: ${HINT_ES_ENABLED}
        es-base-url: ${HINT_ES_BASE_URL}
        es-index-pattern: ${HINT_ES_INDEX_PATTERN}
        es-timeout-ms: ${HINT_ES_TIMEOUT_MS}
