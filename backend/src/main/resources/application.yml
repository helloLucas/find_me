spring:
  application:
    name: lucas

  datasource:
    url: jdbc:postgresql://localhost:5432/lucas
    username: lucas
    password: lucas
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: true

  data:
    redis:
      host: lucas-redis-local
      port: 6379

server:
  port: 8080
